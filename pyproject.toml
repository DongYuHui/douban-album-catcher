[project]
name = "douban-album-catcher"
version = "0.1.0"
description = "豆瓣相册下载助手"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "lxml>=6.1.3,<7",
    "peewee>=4.5.3,<5",
    "requests>=2.34.2,<3",
]

[project.scripts]
douban-album-catcher = "douban_album_catcher.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
